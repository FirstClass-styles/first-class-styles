name: Test First Class Styles reminder email

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  send-test-email:
    runs-on: ubuntu-latest
    steps:
      - name: Send a test reminder to the salon inbox only
        env:
          REMINDER_CRON_SECRET: ${{ secrets.REMINDER_CRON_SECRET }}
        run: |
          if [ -z "$REMINDER_CRON_SECRET" ]; then
            echo "REMINDER_CRON_SECRET is not configured in GitHub Actions."
            exit 1
          fi
          curl --fail --silent --show-error \
            --retry 2 --retry-delay 10 \
            -H "Authorization: Bearer $REMINDER_CRON_SECRET" \
            "https://first-class-styles.vercel.app/api/reminders?test=1"
